name: Windows

# Windows-App (desktop/): eigener Gradle-Build, unabhängig vom Android-Build und ohne Gerätetest
# (teilt sich deshalb auch nicht den Branch ci-results).
on:
  push:
    paths:
      - "desktop/**"
      - "app/src/main/java/de/ayutv/data/parse/**"
      - "app/src/main/java/de/ayutv/data/setup/BackupCrypto.kt"
      - "app/src/main/java/de/ayutv/ui/live/BlockMove.kt"
      - "app/src/main/java/de/ayutv/data/sport/**"
      - "app/src/main/java/de/ayutv/data/net/**"
      - "app/src/main/java/de/ayutv/data/remote/SyncMerge.kt"
      - "app/src/main/java/de/ayutv/player/**"
      - "app/build.gradle.kts"
      - ".github/workflows/desktop.yml"
  pull_request:
    paths:
      - "desktop/**"
      - "app/src/main/java/de/ayutv/data/parse/**"
      - "app/src/main/java/de/ayutv/data/setup/BackupCrypto.kt"
      - "app/src/main/java/de/ayutv/ui/live/BlockMove.kt"
      - "app/src/main/java/de/ayutv/data/sport/**"
      - "app/src/main/java/de/ayutv/data/net/**"
      - "app/src/main/java/de/ayutv/data/remote/SyncMerge.kt"
      - "app/src/main/java/de/ayutv/player/**"
      - "app/build.gradle.kts"
      - ".github/workflows/desktop.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: desktop-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Kompilieren und Unit-Tests (schnell, unter Linux).
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v5
      - name: Kompilieren und testen
        run: ./gradlew -p desktop test --console=plain
      - name: Testergebnisse
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: desktop-tests
          path: desktop/build/reports/tests/
          if-no-files-found: ignore

  # Installer (MSI und EXE) und portable ZIP bauen (DNA Engine mit FFmpeg-Bibliotheken), Starttest.
  windows:
    needs: check
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v5

      - name: Installer bauen
        run: ./gradlew -p desktop packageMsi packageExe createDistributable --console=plain

      - name: Starttest (DNA Engine spielt Testvideos)
        shell: pwsh
        run: |
          $app = Get-ChildItem desktop/build/compose/binaries/main/app -Directory | Select-Object -First 1
          $exe = Join-Path $app.FullName "DnA-TV.exe"
          $out = Join-Path $env:RUNNER_TEMP "selftest.txt"
          $p = Start-Process $exe -ArgumentList "--selftest", "`"$out`"" -PassThru
          if (-not $p.WaitForExit(120000)) { $p.Kill(); throw "Selbsttest hängt" }
          if (-not (Test-Path $out)) {
            # Abgestürzt, bevor ein Ergebnis geschrieben wurde: Exit-Code und JVM-Absturzprotokoll zeigen.
            Write-Host "Kein Ergebnis, Exit-Code $($p.ExitCode)"
            Get-ChildItem -Recurse -Filter "hs_err_pid*.log" $app.FullName, (Get-Location), $env:TEMP -ErrorAction SilentlyContinue | ForEach-Object { Write-Host "== $($_.FullName)"; Get-Content $_.FullName -TotalCount 80 }
            throw "Selbsttest ohne Ergebnis"
          }
          Get-Content $out
          if (-not (Select-String -Path $out -Pattern "^result=OK" -Quiet)) { throw "Selbsttest fehlgeschlagen" }

      # Foto-Rundgang: DnA-TV mit Beispieldaten, alle Bereiche und das Player-Menü fotografiert. Die Bilder landen
      # im Branch ci-windows (zum Prüfen der Oberfläche); ein Fehler hier hält den Build nicht auf.
      - name: Foto-Rundgang (Oberfläche)
        continue-on-error: true
        shell: pwsh
        run: |
          $app = Get-ChildItem desktop/build/compose/binaries/main/app -Directory | Select-Object -First 1
          $exe = Join-Path $app.FullName "DnA-TV.exe"
          $out = Join-Path $env:RUNNER_TEMP "tour"
          New-Item -ItemType Directory -Force $out | Out-Null
          $p = Start-Process $exe -ArgumentList "--tour", "`"$out`"" -PassThru
          if (-not $p.WaitForExit(180000)) { $p.Kill(); Write-Host "Rundgang hängt" }
          Remove-Item -Recurse -Force (Join-Path $out "data") -ErrorAction SilentlyContinue
          Get-ChildItem $out | ForEach-Object { Write-Host $_.Name }
          if (Test-Path (Join-Path $out "results.txt")) { Get-Content (Join-Path $out "results.txt") }

      - name: Fotos veröffentlichen
        if: always()
        continue-on-error: true
        shell: bash
        run: |
          cd "$RUNNER_TEMP/tour" 2>/dev/null || exit 0
          echo "${{ github.sha }}" > COMMIT
          git init -q -b ci-windows
          git config user.name "DnA-TV CI"
          git config user.email "ci@users.noreply.github.com"
          git add -A
          git commit -qm "Fotos für ${{ github.sha }}"
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" ci-windows

      # Signieren, sobald ein Code-Signing-Zertifikat hinterlegt ist (Repository → Settings → Secrets → Actions:
      # WINDOWS_SIGN_CERT = PFX-Datei als Base64, WINDOWS_SIGN_PASSWORD = Passwort). Dann warnt Windows nicht mehr vor
      # „Unbekannter Herausgeber“. Ohne Zertifikat bleibt alles unsigniert wie bisher.
      - name: Signieren (nur mit Zertifikat)
        shell: pwsh
        env:
          SIGN_CERT: ${{ secrets.WINDOWS_SIGN_CERT }}
          SIGN_PASSWORD: ${{ secrets.WINDOWS_SIGN_PASSWORD }}
        run: |
          if (-not $env:SIGN_CERT) { Write-Host "Kein Zertifikat hinterlegt – Installer bleiben unsigniert."; exit 0 }
          $pfx = Join-Path $env:RUNNER_TEMP "sign.pfx"
          [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:SIGN_CERT))
          $signtool = Get-ChildItem "C:\Program Files (x86)\Windows Kits\10\bin\*\x64\signtool.exe" | Sort-Object FullName -Descending | Select-Object -First 1
          $files = @(
            (Get-ChildItem desktop/build/compose/binaries/main/app/DnA-TV/DnA-TV.exe).FullName,
            (Get-ChildItem desktop/build/compose/binaries/main/msi/*.msi | Select-Object -First 1).FullName,
            (Get-ChildItem desktop/build/compose/binaries/main/exe/*.exe | Select-Object -First 1).FullName
          )
          try {
            & $signtool.FullName sign /f $pfx /p $env:SIGN_PASSWORD /fd SHA256 /tr http://timestamp.digicert.com /td SHA256 $files
            if ($LASTEXITCODE -ne 0) { throw "signtool fehlgeschlagen ($LASTEXITCODE)" }
            & $signtool.FullName verify /pa $files
          } finally { Remove-Item $pfx -ErrorAction SilentlyContinue }

      - name: Dateien benennen
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force out | Out-Null
          Copy-Item (Get-ChildItem desktop/build/compose/binaries/main/msi/*.msi | Select-Object -First 1).FullName out/DnA-TV-Windows.msi
          Copy-Item (Get-ChildItem desktop/build/compose/binaries/main/exe/*.exe | Select-Object -First 1).FullName out/DnA-TV-Windows-Setup.exe
          Compress-Archive -Path desktop/build/compose/binaries/main/app/DnA-TV -DestinationPath out/DnA-TV-Windows-portable.zip
          Get-ChildItem out | Format-Table Name, Length

      - uses: actions/upload-artifact@v4
        with:
          name: DnA-TV-Windows
          path: out/

      # Auf main an das Release der aktuellen Version hängen (das legt der Android-Build an; ggf. kurz warten).
      - name: An Release anhängen
        if: github.ref == 'refs/heads/main'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(sed -n 's/.*versionName = "\(.*\)".*/\1/p' app/build.gradle.kts)
          for i in $(seq 1 60); do
            gh release view "v$version" >/dev/null 2>&1 && break
            echo "Release v$version gibt es noch nicht, warte …"; sleep 30
          done
          gh release upload "v$version" out/DnA-TV-Windows.msi out/DnA-TV-Windows-Setup.exe out/DnA-TV-Windows-portable.zip --clobber
